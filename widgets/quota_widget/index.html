<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(0.98); }
    }
    .animate-spin-once {
      animation: spin 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3 select-none">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-4 shadow-md max-w-xl mx-auto backdrop-blur-md">
    
    <!-- 头部区域：标题与状态控制 -->
    <div class="flex items-center justify-between border-b border-[var(--border)] pb-3 mb-3">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-sm shadow-blue-500/20 text-white">
          <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="font-bold text-sm tracking-tight text-[var(--foreground)]">Antigravity 额度面板</h2>
            <span id="tierBadge" class="text-xs px-2 py-0.5 rounded-full font-medium bg-blue-500/10 text-blue-500 border border-blue-500/20">Google AI Pro</span>
          </div>
          <p id="userSubtext" class="text-xs text-[var(--muted-foreground)] truncate max-w-[220px]">刘枭 · liushuiyiran@gmail.com</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- 实时状态小绿点 -->
        <div id="statusPill" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-500 border border-emerald-500/20" title="本地实时链路在线">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping" style="animation-duration: 2.5s;"></span>
          <span id="statusText">实时同步</span>
        </div>

        <!-- 刷新按钮 -->
        <button id="btnRefresh" onclick="refreshQuota()" class="p-1.5 rounded-lg border border-[var(--border)] hover:bg-[var(--secondary)] active:scale-95 transition-all text-[var(--muted-foreground)] hover:text-[var(--foreground)] cursor-pointer" title="刷新额度">
          <svg id="refreshIcon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 21h5v-5" />
          </svg>
        </button>
      </div>
    </div>

    <!-- 模型分组选项卡 (Tab) -->
    <div class="flex items-center gap-1 p-1 bg-[var(--background)]/60 rounded-xl mb-3 border border-[var(--border)]/50">
      <button id="tabGemini" onclick="switchTab('gemini')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--foreground)] shadow-sm">
        ✨ Gemini 模型
      </button>
      <button id="tabOther" onclick="switchTab('other')" class="flex-1 py-1.5 px-3 rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all">
        🤖 Claude & GPT
      </button>
    </div>

    <!-- 额度仪表展示区 -->
    <div id="quotaContainer" class="space-y-3">
      <!-- 5小时额度卡片 -->
      <div class="p-3 rounded-xl bg-[var(--background)]/40 border border-[var(--border)]/60 hover:border-[var(--border)] transition-all">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <polyline points="12 6 12 12 16 14" />
            </svg>
            <span class="text-xs font-semibold text-[var(--foreground)]">5 小时滑动额度</span>
          </div>
          <div class="flex items-center gap-1">
            <span id="rate5hPct" class="text-sm font-bold tracking-tight text-emerald-500 font-mono">95.4%</span>
            <span class="text-[11px] text-[var(--muted-foreground)]">剩余</span>
          </div>
        </div>

        <!-- 进度条 -->
        <div class="w-full bg-[var(--secondary)] rounded-full h-2 overflow-hidden mb-1.5">
          <div id="rate5hBar" class="h-full rounded-full transition-all duration-700 ease-out bg-gradient-to-r from-emerald-500 to-teal-400" style="width: 95.4%;"></div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)]">
          <span id="rate5hReset">预计 4 小时 50 分后充满</span>
          <span id="rate5hDesc" class="truncate max-w-[180px]">平滑高并发容量</span>
        </div>
      </div>

      <!-- 每周额度卡片 -->
      <div class="p-3 rounded-xl bg-[var(--background)]/40 border border-[var(--border)]/60 hover:border-[var(--border)] transition-all">
        <div class="flex items-center justify-between mb-1.5">
          <div class="flex items-center gap-1.5">
            <svg class="w-3.5 h-3.5 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <span class="text-xs font-semibold text-[var(--foreground)]">每周总额度</span>
          </div>
          <div class="flex items-center gap-1">
            <span id="rateWeeklyPct" class="text-sm font-bold tracking-tight text-blue-500 font-mono">82.8%</span>
            <span class="text-[11px] text-[var(--muted-foreground)]">剩余</span>
          </div>
        </div>

        <!-- 进度条 -->
        <div class="w-full bg-[var(--secondary)] rounded-full h-2 overflow-hidden mb-1.5">
          <div id="rateWeeklyBar" class="h-full rounded-full transition-all duration-700 ease-out bg-gradient-to-r from-blue-500 to-indigo-500" style="width: 82.8%;"></div>
        </div>

        <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)]">
          <span id="rateWeeklyReset">预计 18 小时 1 分后刷新</span>
          <span class="text-xs font-medium text-emerald-500">充足</span>
        </div>
      </div>
    </div>

    <!-- 底部状态条 -->
    <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)] pt-3 mt-3 border-t border-[var(--border)]">
      <div class="flex items-center gap-1.5 truncate max-w-[260px]">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-[var(--muted-foreground)]/50"></span>
        <span id="updateTimestamp">更新于: 刚刚</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="requestAssistantRefresh()" class="hover:text-blue-500 transition-colors text-xs font-medium cursor-pointer" title="通过 Antigravity 助手全量刷新">
          发起对话刷新
        </button>
      </div>
    </div>

  </div>

  <script>
    // 初始快照数据
    let state = {
      activeTab: 'gemini',
      user: {
        name: '刘枭',
        email: 'liushuiyiran@gmail.com',
        tier: 'Google AI Pro',
        plan: 'Pro'
      },
      groups: [
        {
          displayName: 'Gemini Models',
          description: 'Models within this group: Gemini Flash, Gemini Pro',
          buckets: [
            {
              bucketId: 'gemini-weekly',
              displayName: 'Weekly Limit Remaining',
              window: 'weekly',
              remainingFraction: 0.8281054,
              resetTime: '2026-10-01T05:18:32Z'
            },
            {
              bucketId: 'gemini-5h',
              displayName: 'Five Hour Limit Remaining',
              window: '5h',
              remainingFraction: 0.9537926,
              resetTime: '2026-09-30T16:07:36Z'
            }
          ]
        },
        {
          displayName: 'Claude and GPT models',
          description: 'Models within this group: Claude Opus, Claude Sonnet, GPT-OSS',
          buckets: [
            {
              bucketId: '3p-weekly',
              displayName: 'Weekly Limit Remaining',
              window: 'weekly',
              remainingFraction: 1.0,
              resetTime: '2026-10-07T11:14:22Z'
            },
            {
              bucketId: '3p-5h',
              displayName: 'Five Hour Limit Remaining',
              window: '5h',
              remainingFraction: 1.0,
              resetTime: '2026-09-30T16:14:22Z'
            }
          ]
        }
      ],
      isLive: false,
      lastUpdated: new Date()
    };

    function formatTimeRemaining(isoString) {
      if (!isoString) return '充足';
      const target = new Date(isoString);
      const now = new Date();
      const diffMs = target.getTime() - now.getTime();
      if (diffMs <= 0) return '即将重置';

      const diffMins = Math.floor(diffMs / (1000 * 60));
      const hours = Math.floor(diffMins / 60);
      const mins = diffMins % 60;
      const days = Math.floor(hours / 24);

      if (days > 0) {
        return `约 ${days} 天 ${hours % 24} 小时后刷新`;
      }
      if (hours > 0) {
        return `约 ${hours} 小时 ${mins} 分后刷新`;
      }
      return `约 ${mins} 分钟后刷新`;
    }

    function getGradientClass(fraction) {
      if (fraction >= 0.7) return 'from-emerald-500 to-teal-400';
      if (fraction >= 0.3) return 'from-amber-500 to-yellow-400';
      return 'from-rose-500 to-red-400';
    }

    function getTextColorClass(fraction) {
      if (fraction >= 0.7) return 'text-emerald-500';
      if (fraction >= 0.3) return 'text-amber-500';
      return 'text-rose-500';
    }

    function render() {
      // 渲染用户信息
      if (state.user) {
        document.getElementById('tierBadge').textContent = state.user.tier || 'Google AI Pro';
        document.getElementById('userSubtext').textContent = `${state.user.name || 'User'} · ${state.user.email || ''}`;
      }

      // 获取当前 Tab 对应的数据
      const groupIdx = state.activeTab === 'gemini' ? 0 : 1;
      const currentGroup = state.groups[groupIdx] || state.groups[0];

      if (currentGroup && currentGroup.buckets) {
        const bucket5h = currentGroup.buckets.find(b => b.window === '5h') || currentGroup.buckets[1] || {};
        const bucketWeekly = currentGroup.buckets.find(b => b.window === 'weekly') || currentGroup.buckets[0] || {};

        const frac5h = typeof bucket5h.remainingFraction === 'number' ? bucket5h.remainingFraction : 1.0;
        const fracWeekly = typeof bucketWeekly.remainingFraction === 'number' ? bucketWeekly.remainingFraction : 1.0;

        const pct5h = (frac5h * 100).toFixed(1) + '%';
        const pctWeekly = (fracWeekly * 100).toFixed(1) + '%';

        // 5小时额度
        const elPct5h = document.getElementById('rate5hPct');
        const elBar5h = document.getElementById('rate5hBar');
        const elReset5h = document.getElementById('rate5hReset');

        elPct5h.textContent = pct5h;
        elPct5h.className = `text-sm font-bold tracking-tight font-mono ${getTextColorClass(frac5h)}`;
        elBar5h.style.width = pct5h;
        elBar5h.className = `h-full rounded-full transition-all duration-700 ease-out bg-gradient-to-r ${getGradientClass(frac5h)}`;
        elReset5h.textContent = bucket5h.resetTime ? formatTimeRemaining(bucket5h.resetTime) : '随时恢复';

        // 每周额度
        const elPctW = document.getElementById('rateWeeklyPct');
        const elBarW = document.getElementById('rateWeeklyBar');
        const elResetW = document.getElementById('rateWeeklyReset');

        elPctW.textContent = pctWeekly;
        elPctW.className = `text-sm font-bold tracking-tight font-mono ${getTextColorClass(fracWeekly)}`;
        elBarW.style.width = pctWeekly;
        elBarW.className = `h-full rounded-full transition-all duration-700 ease-out bg-gradient-to-r ${getGradientClass(fracWeekly)}`;
        elResetW.textContent = bucketWeekly.resetTime ? formatTimeRemaining(bucketWeekly.resetTime) : '下周刷新';
      }

      // 时间戳
      const timeStr = state.lastUpdated ? new Date(state.lastUpdated).toLocaleTimeString() : '刚刚';
      document.getElementById('updateTimestamp').textContent = `更新于: ${timeStr}`;

      // 实时状态药丸
      const pill = document.getElementById('statusPill');
      const text = document.getElementById('statusText');
      if (state.isLive) {
        pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-500 border border-emerald-500/20';
        text.textContent = '实时同步';
      } else {
        pill.className = 'flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-500 border border-amber-500/20';
        text.textContent = '快照模式';
      }
    }

    function switchTab(tab) {
      state.activeTab = tab;
      const tabG = document.getElementById('tabGemini');
      const tabO = document.getElementById('tabOther');

      if (tab === 'gemini') {
        tabG.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--foreground)] shadow-sm';
        tabO.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all';
      } else {
        tabO.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-semibold transition-all bg-[var(--card)] text-[var(--foreground)] shadow-sm';
        tabG.className = 'flex-1 py-1.5 px-3 rounded-lg text-xs font-medium text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-all';
      }
      render();
    }

    async function refreshQuota() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('animate-spin-once');
      setTimeout(() => icon.classList.remove('animate-spin-once'), 600);

      try {
        const res = await fetch('http://127.0.0.1:12655/api/quota', { method: 'GET', cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (data.status === 'ok' && data.quota) {
          state.groups = data.quota.groups || state.groups;
          if (data.user) state.user = data.user;
          state.isLive = true;
          state.lastUpdated = new Date();
          render();
          return;
        }
      } catch (e) {
        state.isLive = false;
        render();
      }
    }

    function requestAssistantRefresh() {
      if (window.parent) {
        window.parent.postMessage({
          type: 'PROMPT',
          prompt: '请帮我刷新一下antigravity额度'
        }, '*');
      }
    }

    // 初始化渲染
    render();
    // 启动即刻尝试探测本地实时链路
    refreshQuota();
    // 每 30 秒自动轮询实时数据
    setInterval(refreshQuota, 30000);
  </script>
</body>
</html>
