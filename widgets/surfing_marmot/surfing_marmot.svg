<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>冲浪的土拨鼠 · Surfing Marmot</title>

  <!-- ===================== 渐变与特效定义 ===================== -->
  <defs>
    <!-- 天空渐变：夏日晚霞/热带海滩风 -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="40%" stop-color="#ff7eb3"/>
      <stop offset="70%" stop-color="#fed6e3"/>
      <stop offset="100%" stop-color="#d4fc79"/>
    </linearGradient>

    <!-- 巨浪渐变 -->
    <linearGradient id="waveBackGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#005c97"/>
      <stop offset="100%" stop-color="#363795"/>
    </linearGradient>
    
    <linearGradient id="waveFrontGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- 土拨鼠毛发渐变 -->
    <linearGradient id="marmotFur" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#c68b59"/>
      <stop offset="60%" stop-color="#a06334"/>
      <stop offset="100%" stop-color="#733e17"/>
    </linearGradient>

    <linearGradient id="marmotBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce2c4"/>
      <stop offset="100%" stop-color="#eec39a"/>
    </linearGradient>

    <!-- 冲浪板渐变 -->
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ff0844"/>
    </linearGradient>

    <!-- 太阳镜反光 -->
    <linearGradient id="shadesGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="40%" stop-color="#ffb199"/>
      <stop offset="70%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#a6c1ee"/>
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ===================== 背景天空与太阳 ===================== -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- 落日大太阳 -->
  <g transform="translate(180 180)">
    <circle r="90" fill="#fffbdf" opacity="0.85"/>
    <circle r="75" fill="#ffe066" filter="url(#softShadow)"/>
    <!-- 太阳的酷炫条纹（80年代复古波普风） -->
    <path d="M-65 20 H65 M-55 35 H55 M-40 50 H40" stroke="#ff758c" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 海鸥（展翅动画） -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none">
    <g transform="translate(120, 100)">
      <path d="M-20 0 Q-10 -15 0 0 Q10 -15 20 0">
        <animate attributeName="d" dur="1s" repeatCount="indefinite"
          values="M-20 0 Q-10 -15 0 0 Q10 -15 20 0;
                  M-20 -5 Q-10 10 0 0 Q10 10 20 -5;
                  M-20 0 Q-10 -15 0 0 Q10 -15 20 0"/>
      </path>
    </g>
    <g transform="translate(240, 70) scale(0.7)">
      <path d="M-20 0 Q-10 -15 0 0 Q10 -15 20 0">
        <animate attributeName="d" dur="1.2s" begin="0.3s" repeatCount="indefinite"
          values="M-20 0 Q-10 -15 0 0 Q10 -15 20 0;
                  M-20 -5 Q-10 10 0 0 Q10 10 20 -5;
                  M-20 0 Q-10 -15 0 0 Q10 -15 20 0"/>
      </path>
    </g>
  </g>

  <!-- ===================== 澎湃巨浪（背景层） ===================== -->
  <!-- 远景暗浪卷管 -->
  <path d="M -50 650 Q 150 480 350 500 C 600 520 700 300 650 180 C 580 40 400 120 440 220 C 470 290 560 300 520 380 C 460 480 200 450 -50 650 Z" 
        fill="url(#waveBackGrad)" opacity="0.9"/>

  <!-- ===================== 冲浪板与土拨鼠动态组 ===================== -->
  <!-- 整个角色连同板子随波颠簸律动 -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      dur="1.8s" repeatCount="indefinite"
      values="-4 380 380; 6 380 380; -4 380 380"/>

    <!-- 冲浪板浪花与阴影 -->
    <ellipse cx="370" cy="445" rx="140" ry="12" fill="#003554" opacity="0.4" transform="rotate(-12 370 445)"/>

    <!-- 酷炫冲浪板 -->
    <g transform="rotate(-14 370 420)">
      <!-- 板身 -->
      <path d="M 180 420 Q 370 385 570 415 Q 590 418 575 425 Q 370 455 180 420 Z" 
            fill="url(#boardGrad)" stroke="#ffffff" stroke-width="3" filter="url(#softShadow)"/>
      <!-- 板面闪电条纹 -->
      <path d="M 230 419 L 320 407 L 350 416 L 460 407 L 550 417" fill="none" stroke="#fffb00" stroke-width="5" stroke-linecap="round"/>
      <!-- 板尾水流导流槽/鳍尾反光 -->
      <path d="M 185 417 Q 210 420 185 423 Z" fill="#ffffff"/>
    </g>

    <!-- 脚绳 (Leash) 绑在脚踝和板尾 -->
    <path d="M 320 400 Q 250 430 220 418" fill="none" stroke="#ffeb3b" stroke-width="4" stroke-dasharray="3 2" stroke-linecap="round"/>

    <!-- ===================== 土拨鼠主体 ===================== -->
    <g transform="translate(10, -10)">
      <!-- 胖嘟嘟短尾巴（在后面摇摆） -->
      <path d="M 285 365 C 250 380 230 355 240 335 C 255 330 275 350 285 365 Z" fill="#733e17">
        <animateTransform attributeName="transform" type="rotate" dur="0.8s" repeatCount="indefinite"
          values="0 285 365; -15 285 365; 0 285 365"/>
      </path>

      <!-- 后脚 (踩在板尾，半蹲稳重) -->
      <ellipse cx="320" cy="402" rx="22" ry="12" fill="#733e17" transform="rotate(-5 320 402)"/>
      <!-- 后脚爪爪 -->
      <circle cx="335" cy="403" r="3" fill="#2d1607"/>
      <circle cx="338" cy="407" r="3" fill="#2d1607"/>
      <circle cx="334" cy="411" r="3" fill="#2d1607"/>

      <!-- 胖敦敦的身体 (重心压低、酷酷的冲浪姿态) -->
      <path d="M 300 370 C 290 320 330 260 380 260 C 430 260 450 300 450 360 C 450 405 400 415 350 410 C 315 405 305 390 300 370 Z" 
            fill="url(#marmotFur)" filter="url(#softShadow)"/>

      <!-- 软绵绵的大肚皮 -->
      <path d="M 345 375 C 335 325 365 295 400 295 C 425 295 435 325 430 365 C 425 395 385 405 345 375 Z" 
            fill="url(#marmotBelly)"/>

      <!-- 前脚 (踩在板中前方，抓力十足) -->
      <ellipse cx="420" cy="392" rx="24" ry="13" fill="#8d4f20" transform="rotate(8 420 392)"/>
      <circle cx="438" cy="390" r="3.2" fill="#2d1607"/>
      <circle cx="442" cy="395" r="3.2" fill="#2d1607"/>
      <circle cx="439" cy="400" r="3.2" fill="#2d1607"/>

      <!-- 招牌土拨鼠大脑袋 -->
      <!-- 后耳 -->
      <ellipse cx="370" cy="195" rx="10" ry="14" fill="#603413" transform="rotate(-15 370 195)"/>
      <ellipse cx="371" cy="196" rx="6" ry="9" fill="#ffb4a2" transform="rotate(-15 371 196)"/>

      <!-- 头部主体 (圆滚滚+肉肉腮帮子) -->
      <path d="M 360 230 C 350 185 410 165 440 185 C 475 200 480 240 455 265 C 425 285 375 270 360 230 Z" 
            fill="url(#marmotFur)"/>

      <!-- 前耳 -->
      <ellipse cx="400" cy="190" rx="11" ry="15" fill="#733e17" transform="rotate(10 400 190)"/>
      <ellipse cx="400" cy="191" rx="7" ry="10" fill="#fce2c4" transform="rotate(10 400 191)"/>

      <!-- 标志性的大腮帮与嘴吻 -->
      <ellipse cx="445" cy="245" rx="22" ry="16" fill="#fce2c4"/>
      <ellipse cx="425" cy="248" rx="18" ry="15" fill="#fce2c4"/>

      <!-- 土拨鼠经典灵魂：两颗标志性大板牙！ -->
      <g transform="translate(442, 252)">
        <rect x="0" y="0" width="8" height="13" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
        <rect x="8.5" y="0" width="8" height="13" rx="2" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.2"/>
        <line x1="8.2" y1="0" x2="8.2" y2="13" stroke="#dcdcdc" stroke-width="1"/>
      </g>

      <!-- 倒三角小黑鼻头 -->
      <path d="M 440 235 Q 448 231 456 235 Q 450 245 448 245 Z" fill="#201108"/>
      <ellipse cx="446" cy="235" rx="3" ry="1.5" fill="#ffffff" opacity="0.6"/>

      <!-- 调皮自信的小歪嘴 -->
      <path d="M 434 252 Q 446 256 458 252" fill="none" stroke="#4a2810" stroke-width="2.5" stroke-linecap="round"/>

      <!-- 几根俏皮胡须 -->
      <g stroke="#ffffff" stroke-width="1.5" opacity="0.8" stroke-linecap="round">
        <line x1="455" y1="242" x2="480" y2="238"/>
        <line x1="456" y1="247" x2="482" y2="249"/>
        <line x1="454" y1="252" x2="478" y2="258"/>
      </g>

      <!-- 🏄‍♂️ 灵魂装备：超拽的彩色反光太阳镜 -->
      <!-- 镜腿 -->
      <path d="M 378 206 L 398 214" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- 左镜片 (透视偏小) -->
      <path d="M 395 212 Q 412 208 418 216 Q 420 232 405 234 Q 392 232 395 212 Z" 
            fill="url(#shadesGrad)" stroke="#111111" stroke-width="3.5"/>
      <!-- 鼻梁架 -->
      <path d="M 418 219 Q 425 217 430 220" fill="none" stroke="#111" stroke-width="3.5"/>
      <!-- 右镜片 (主视觉) -->
      <path d="M 428 218 Q 456 215 464 225 Q 465 243 445 245 Q 425 243 428 218 Z" 
            fill="url(#shadesGrad)" stroke="#111111" stroke-width="3.5"/>
      <!-- 墨镜高光反光杠 -->
      <line x1="400" y1="216" x2="410" y2="230" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <line x1="435" y1="222" x2="452" y2="240" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
      <line x1="443" y1="222" x2="457" y2="234" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

      <!-- 胖爪爪姿势：后爪张开保持平衡，前爪比出经典的夏威夷冲浪手势🤙 (Shaka) -->
      <!-- 左爪 (后方保持平衡) -->
      <path d="M 320 320 Q 280 290 260 300 Q 255 315 275 325 Q 300 335 325 330 Z" fill="#8d4f20"/>
      
      <!-- 右手爪 (前方冲浪打招呼) -->
      <g transform="translate(430, 290)">
        <path d="M 0 20 Q 30 15 55 -5 C 65 -15 75 0 65 15 Q 40 35 10 35 Z" fill="#8d4f20"/>
        <!-- 🤙 手势细节：大拇指和小指翘起，中间手指蜷缩 -->
        <!-- 小拇指翘起 -->
        <path d="M 50 15 Q 65 25 68 35 Q 62 40 54 30 Z" fill="#a06334"/>
        <!-- 大拇指翘起 -->
        <path d="M 52 -3 Q 65 -15 72 -8 Q 68 2 55 5 Z" fill="#a06334"/>
        <!-- 中间蜷缩指头 -->
        <circle cx="50" cy="14" r="5" fill="#733e17"/>
        <circle cx="48" cy="7" r="5.5" fill="#733e17"/>
      </g>

      <!-- 脖子上的夏威夷花环 (小花朵簇拥) -->
      <g>
        <!-- 花朵1 红 -->
        <circle cx="375" cy="275" r="7" fill="#ff4d6d"/>
        <circle cx="375" cy="275" r="3" fill="#ffe66d"/>
        <!-- 花朵2 黄 -->
        <circle cx="390" cy="283" r="7" fill="#ffd166"/>
        <circle cx="390" cy="283" r="3" fill="#ffffff"/>
        <!-- 花朵3 蓝 -->
        <circle cx="410" cy="285" r="7" fill="#4cc9f0"/>
        <circle cx="410" cy="285" r="3" fill="#ffe66d"/>
        <!-- 花朵4 粉 -->
        <circle cx="426" cy="278" r="7" fill="#ff758f"/>
        <circle cx="426" cy="278" r="3" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- ===================== 前景巨浪、浪花管与飞溅水沫 ===================== -->
  <!-- 前排卷浪弧线 -->
  <path d="M -20 620 C 150 560 300 520 480 500 C 660 480 820 540 850 620 L 850 650 L -20 650 Z" 
        fill="url(#waveFrontGrad)" opacity="0.85"/>

  <!-- 浪花顶部的白色泡沫飞卷 -->
  <path d="M 430 200 C 470 230 460 280 520 290 C 580 300 640 240 620 180 C 600 130 520 120 450 160 Z" 
        fill="#ffffff" opacity="0.95"/>
  <path d="M 480 230 C 510 240 520 270 550 260 C 580 250 600 210 580 180" 
        fill="none" stroke="#e0f7fa" stroke-width="4"/>

  <!-- 动态飞溅浪花水珠 (多组动画粒子) -->
  <!-- 板尾飞溅的浪花羽翼 -->
  <g fill="#ffffff">
    <!-- 浪花簇 1 -->
    <path d="M 230 420 Q 180 380 140 400 Q 180 430 230 425 Z" opacity="0.9">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite"
        values="M 230 420 Q 180 380 140 400 Q 180 430 230 425 Z;
                M 230 420 Q 160 360 120 390 Q 170 435 230 425 Z;
                M 230 420 Q 180 380 140 400 Q 180 430 230 425 Z"/>
    </path>
    <!-- 浪花簇 2 -->
    <path d="M 250 435 Q 200 420 170 450 Q 210 460 250 440 Z" opacity="0.75"/>

    <!-- 弹跳小水滴 -->
    <circle cx="160" cy="370" r="4">
      <animate attributeName="cy" values="370;340;370" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="160;140;160" dur="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="390" r="3">
      <animate attributeName="cy" values="390;365;390" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="340" r="5">
      <animate attributeName="cy" values="340;310;340" dur="0.8s" begin="0.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="330" r="3.5">
      <animate attributeName="cy" values="330;305;330" dur="0.9s" begin="0.4s" repeatCount="indefinite"/>
    </circle>

    <!-- 卷浪顶端洒落的水珠 -->
    <circle cx="440" cy="150" r="3.5"><animate attributeName="cy" values="150;220" dur="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="180" r="4.5"><animate attributeName="cy" values="180;260" dur="0.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="505" cy="210" r="3"><animate attributeName="cy" values="210;280" dur="0.9s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="0.9s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===================== 趣味漫画气泡 ===================== -->
  <g transform="translate(480, 75)">
    <!-- 吼叫气泡框 (土拨鼠名场面：啊~~~~~！) -->
    <path d="M 30 50 L 5 85 L 45 68 Z" fill="#ffffff" stroke="#222222" stroke-width="2.5"/>
    <rect x="20" y="10" width="175" height="60" rx="20" fill="#ffffff" stroke="#222222" stroke-width="2.5" filter="url(#softShadow)"/>
    <text x="108" y="44" text-anchor="middle" font-family="'Impact','Arial Black',sans-serif" font-size="22" fill="#ff0844" letter-spacing="1.5">
      AHHHH~ SURF!
    </text>
    <text x="108" y="60" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" font-weight="bold" fill="#333333">
      🤙 浪起来，哈基米！ 🌊
    </text>
  </g>
</svg>
