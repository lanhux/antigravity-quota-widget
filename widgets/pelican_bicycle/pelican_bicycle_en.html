<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelican on a Bicycle</title>

  <style>
    @keyframes bellRing {
      0%, 100% { transform: rotate(0deg); }
      20%, 60% { transform: rotate(-22deg); }
      40%, 80% { transform: rotate(22deg); }
    }
    .ring-active {
      animation: bellRing 0.45s ease-in-out;
      transform-origin: 496px 286px;
    }
    @keyframes pouchPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .pouch-bounce {
      animation: pouchPulse 0.4s ease-out;
      transform-origin: 540px 220px;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(15px, -45px) scale(1.4); }
    }
    .float-item {
      position: absolute;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      font-size: 22px;
      z-index: 50;
    }
  </style>
</head>

  <script>
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playBikeBell() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [0, 0.12].forEach(offset => {
          [2400, 3100, 3800].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + offset);
            gain.gain.setValueAtTime(0.18 / (idx + 1), now + offset);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.38);
          });
        });
      } catch (e) {}
    }

    function playGulp() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    function playTurboSound(isStart) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        if (isStart) {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
        } else {
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.3);
        }
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.42);
      } catch (e) {}
    }

    const speechText = document.getElementById('speechText');
    const statusTag = document.getElementById('statusTag');
    const speedNum = document.getElementById('speedNum');
    const fishCountEl = document.getElementById('fishCount');
    const sunglassesGroup = document.getElementById('sunglassesGroup');
    const turboFlame = document.getElementById('turboFlame');
    const effectsLayer = document.getElementById('effectsLayer');

    let fishCount = 0;
    let shadesOn = false;
    let isTurbo = false;
    let speechTimer = null;

    function setSpeech(text, duration = 1800) {
      if (!speechText) return;
      speechText.textContent = text;
      if (speechTimer) clearTimeout(speechTimer);
      speechTimer = setTimeout(() => {
        speechText.textContent = isTurbo ? 'Dash~!' : 'Wheee~!';
      }, duration);
    }

    function spawnFloatingEffect(emoji, x, y) {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = emoji;
      el.style.left = (x || (45 + Math.random() * 20)) + '%';
      el.style.top = (y || (30 + Math.random() * 15)) + '%';
      effectsLayer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    document.getElementById('btnBell').addEventListener('click', () => {
      playBikeBell();
      setSpeech('Ding Ding~!');
      spawnFloatingEffect('🔔', 62, 38);
      const bell = document.querySelector('circle[cx="496"][cy="286"]');
      if (bell) {
        bell.classList.remove('ring-active');
        void bell.offsetWidth;
        bell.classList.add('ring-active');
      }
    });

    document.getElementById('btnFeed').addEventListener('click', () => {
      playGulp();
      fishCount++;
      fishCountEl.textContent = fishCount;
      const cheers = ['Yummy fish +1!', 'Delicious~!', 'Energy boosted!', 'Full throttle!', 'Super snack!'];
      setSpeech(cheers[fishCount % cheers.length]);
      spawnFloatingEffect('🐟', 68, 28);
      const pouch = document.querySelector('path[fill="url(#pouch)"]');
      if (pouch) {
        pouch.classList.remove('pouch-bounce');
        void pouch.offsetWidth;
        pouch.classList.add('pouch-bounce');
      }
    });

    document.getElementById('btnShades').addEventListener('click', () => {
      shadesOn = !shadesOn;
      document.getElementById('shadesText').textContent = shadesOn ? 'No Shades' : 'Shades';
      if (sunglassesGroup) {
        if (shadesOn) {
          sunglassesGroup.setAttribute('opacity', '1');
          sunglassesGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
          setSpeech('Cool Bird~ 😎');
          spawnFloatingEffect('✨', 60, 20);
        } else {
          sunglassesGroup.setAttribute('opacity', '0');
          sunglassesGroup.setAttribute('transform', 'translate(488, 166) scale(0.1)');
          setSpeech('Clear view~');
        }
      }
    });

    document.getElementById('btnTurbo').addEventListener('click', () => {
      isTurbo = !isTurbo;
      playTurboSound(isTurbo);
      const turboBtn = document.getElementById('btnTurbo');
      const turboText = document.getElementById('turboText');

      if (isTurbo) {
        turboText.textContent = 'Cruise';
        turboBtn.classList.remove('from-amber-500', 'to-rose-500');
        turboBtn.classList.add('from-rose-600', 'to-red-700', 'ring-2', 'ring-rose-400');
        statusTag.textContent = '⚡ Turbo Mode 88km/h';
        statusTag.className = 'inline-flex items-center px-1.5 py-0.2 rounded-md bg-rose-500/10 text-rose-600 font-bold text-[10px] border border-rose-500/20';
        speedNum.textContent = '88';
        speedNum.classList.add('text-rose-500');
        if (turboFlame) turboFlame.setAttribute('opacity', '1');
        setSpeech('Blast off! 🚀', 2500);
        spawnFloatingEffect('💨', 25, 68);
        spawnFloatingEffect('🔥', 20, 72);
      } else {
        turboText.textContent = 'Turbo';
        turboBtn.classList.remove('from-rose-600', 'to-red-700', 'ring-2', 'ring-rose-400');
        turboBtn.classList.add('from-amber-500', 'to-rose-500');
        statusTag.textContent = 'Cruising 24km/h';
        statusTag.className = 'inline-flex items-center px-1.5 py-0.2 rounded-md bg-emerald-500/10 text-emerald-600 font-medium text-[10px] border border-emerald-500/20';
        speedNum.textContent = '24';
        speedNum.classList.remove('text-rose-500');
        if (turboFlame) turboFlame.setAttribute('opacity', '0');
        setSpeech('Slowing down~');
      }
    });
  </script>
</body>
</html>
