<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕骑自行车 · Pelican on a Bicycle</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    @keyframes bellRing {
      0%, 100% { transform: rotate(0deg); }
      20%, 60% { transform: rotate(-22deg); }
      40%, 80% { transform: rotate(22deg); }
    }
    .ring-active {
      animation: bellRing 0.45s ease-in-out;
      transform-origin: 496px 286px;
    }
    @keyframes pouchPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .pouch-bounce {
      animation: pouchPulse 0.4s ease-out;
      transform-origin: 540px 220px;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(15px, -45px) scale(1.4); }
    }
    .float-item {
      position: absolute;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
      font-size: 22px;
      z-index: 50;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2 sm:p-3 select-none">
  <div class="bg-[var(--card)] text-[var(--foreground)] border border-[var(--border)] rounded-2xl p-3 shadow-lg max-w-2xl mx-auto backdrop-blur-sm">
    <!-- 头部仪表条 -->
    <div class="flex items-center justify-between mb-2 px-1">
      <div class="flex items-center gap-2">
        <span class="text-xl">🚴</span>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-[var(--foreground)] leading-tight">鹈鹕特快 · 快乐骑行中</h1>
          <div class="text-[11px] text-[var(--muted-foreground)] flex items-center gap-2">
            <span id="statusTag" class="inline-flex items-center px-1.5 py-0.2 rounded-md bg-emerald-500/10 text-emerald-600 font-medium text-[10px] border border-emerald-500/20">悠闲巡航 24km/h</span>
            <span>已投喂: <strong id="fishCount" class="text-amber-500 font-bold">0</strong> 条鱼</span>
          </div>
        </div>
      </div>
      <!-- 速度计 -->
      <div class="flex items-baseline gap-1 bg-[var(--background)] px-2.5 py-1 rounded-xl border border-[var(--border)] shadow-xs">
        <span class="text-xs text-[var(--muted-foreground)] font-mono">SPD</span>
        <span id="speedNum" class="text-base font-extrabold font-mono text-[var(--foreground)] tracking-tight">24</span>
        <span class="text-[10px] text-[var(--muted-foreground)] font-mono">km/h</span>
      </div>
    </div>

    <!-- SVG 画布区域 -->
    <div id="svgWrapper" class="relative overflow-hidden rounded-xl border border-[var(--border)] shadow-inner bg-gradient-to-b from-sky-100 to-amber-50 group aspect-[4/3] max-h-[310px] flex items-center justify-center">
      <svg id="pelicanSvg" class="w-full h-auto block select-none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>骑自行车的鹈鹕 · Pelican on a Bicycle</title>

  <!-- ===================== DEFS ===================== -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="0.7" stop-color="#d6f0ff"/>
      <stop offset="1" stop-color="#fff6e0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff7b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="feather" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f1f4f7"/>
      <stop offset="1" stop-color="#dde4ea"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f7a531"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc07a"/>
      <stop offset="0.55" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd1c3"/>
      <stop offset="1" stop-color="#169c90"/>
    </linearGradient>

    <!-- 车轮（辐条带旋转动画） -->
    <g id="wheel">
      <circle r="75" fill="none" stroke="#2b2d42" stroke-width="10"/>
      <circle r="75" fill="none" stroke="#4a4e69" stroke-width="2" stroke-dasharray="3 6"/>
      <circle r="68" fill="none" stroke="#b8c2cc" stroke-width="3.5"/>
      <circle r="64" fill="none" stroke="#dfe5ea" stroke-width="1"/>
      <g stroke="#9aa5b1" stroke-width="1.6">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
        <line x1="0" y1="-66" x2="0" y2="66"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(22.5)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(45)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(67.5)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(90)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(112.5)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(135)"/>
        <line x1="0" y1="-66" x2="0" y2="66" transform="rotate(157.5)"/>
        <rect x="-3" y="-50" width="6" height="12" rx="2" fill="#ffb703" stroke="none"/>
      </g>
      <circle r="9" fill="#6c757d"/>
      <circle r="4" fill="#e9ecef"/>
    </g>

    <!-- 蹼足（脚底 y=-3 正好贴在踏板顶面） -->
    <g id="foot">
      <path d="M -12 -3 Q -13 -11 -3 -11 Q 10 -11 20 -8 Q 27 -6 25 -3 Q 22 -1 19 -3 Q 16 -1 13 -3 Z"/>
      <path d="M 2 -9 Q 10 -7 18 -5 M 0 -7 Q 8 -5 14 -4" fill="none" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- 踏板（中心即曲柄末端） -->
    <g id="pedal">
      <rect x="-13" y="-3" width="26" height="6" rx="2" fill="#3d405b"/>
      <rect x="-11" y="-1" width="5" height="2" fill="#ffb703"/>
      <rect x="6" y="-1" width="5" height="2" fill="#ff6b6b"/>
    </g>
  </defs>

  
  <!-- 氮气加速尾焰 -->
  <g id="turboFlame" opacity="0" transform="translate(210, 445)" style="transition: opacity 0.3s ease;">
    <path d="M0 -8 C -40 -15 -80 -5 -110 0 C -80 5 -40 15 0 8 Z" fill="#38bdf8" opacity="0.8">
      <animate attributeName="d" values="M0 -8 C -40 -15 -80 -5 -110 0 C -80 5 -40 15 0 8 Z; M0 -10 C -50 -20 -90 -3 -130 0 C -90 3 -50 20 0 10 Z; M0 -8 C -40 -15 -80 -5 -110 0 C -80 5 -40 15 0 8 Z" dur="0.15s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -5 C -30 -8 -50 -2 -70 0 C -50 2 -30 8 0 5 Z" fill="#fbbf24" opacity="0.9">
      <animate attributeName="d" values="M0 -5 C -30 -8 -50 -2 -70 0 C -50 2 -30 8 0 5 Z; M0 -7 C -35 -10 -60 -2 -85 0 C -60 2 -35 10 0 7 Z; M0 -5 C -30 -8 -50 -2 -70 0 C -50 2 -30 8 0 5 Z" dur="0.12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -2 C -15 -3 -30 -1 -45 0 C -30 1 -15 3 0 2 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- ===================== 背景 ===================== -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g transform="translate(95 90)">
    <circle r="80" fill="url(#sunGlow)"/>
    <g stroke="#ffd93d" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/>
      <line x1="0" y1="-52" x2="0" y2="-64"/><line x1="0" y1="52" x2="0" y2="64"/>
      <line x1="-52" y1="0" x2="-64" y2="0"/><line x1="52" y1="0" x2="64" y2="0"/>

  <!-- 远山 -->

  <rect y="505" width="800" height="4" fill="#5c6378"/>

    <path d="M690 498 l4 -14 l3 14 l4 -10 l2 10" fill="none" stroke="#4caf50" stroke-width="2"/>

    <g transform="translate(640 590)"><circle cx="-5" r="3.5" fill="#bde0fe"/><circle cx="5" r="3.5" fill="#bde0fe"/><circle cy="-5" r="3.5" fill="#bde0fe"/><circle cy="5" r="3.5" fill="#bde0fe"/><circle r="3" fill="#ffd166"/></g>
    <g transform="translate(250 585)"><circle cx="-5" r="3.5" fill="#ffffff"/><circle cx="5" r="3.5" fill="#ffffff"/><circle cy="-5" r="3.5" fill="#ffffff"/><circle cy="5" r="3.5" fill="#ffffff"/><circle r="3" fill="#ffb703"/></g>
  </g>

  <!-- 速度线 & 扬尘 -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="40" y1="300" x2="130" y2="300"><animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="70" y1="350" x2="150" y2="350"><animate attributeName="opacity" values="0.3;1;0.3" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="30" y1="410" x2="140" y2="410"><animate attributeName="opacity" values="1;0.3;1" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="80" y1="460" x2="150" y2="460"><animate attributeName="opacity" values="0.4;1;0.4" dur="0.5s" repeatCount="indefinite"/></line>
  </g>
  <g fill="#ece6da" opacity="0.9">
    <circle cx="160" cy="512" r="9"><animate attributeName="r" values="9;12;9" dur="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="505" r="6"><animate attributeName="r" values="6;9;6" dur="0.6s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="512" r="4"><animate attributeName="r" values="4;6;4" dur="0.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- 地面阴影 -->
  <ellipse cx="400" cy="522" rx="195" ry="9" fill="#000" opacity="0.18"/>

  <!-- 对话气泡 -->

    <path d="M 572 106 L 518 130 L 592 108 Z" fill="#ffffff" stroke="#3d405b" stroke-width="2" stroke-linejoin="round"/>
    <rect x="545" y="58" width="150" height="52" rx="26" fill="#ffffff" stroke="#3d405b" stroke-width="2"/>
    <path d="M 574 107 L 590 107" stroke="#ffffff" stroke-width="4"/>
    <text id="speechText" x="620" y="92" text-anchor="middle" font-family="'Comic Sans MS','Segoe UI',sans-serif" font-size="24" font-weight="bold" fill="#ff6b6b">Wheee~!</text>
  </g>

  <script>
    // Web Audio 合成器音效（零依赖、轻量）
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 1. 清脆自行车铃铛音效 (双音金属叮铃)
    function playBikeBell() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        [0, 0.12].forEach(offset => {
          [2400, 3100, 3800].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + offset);
            gain.gain.setValueAtTime(0.18 / (idx + 1), now + offset);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.38);
          });
        });
      } catch (e) {}
    }

    // 2. 吞食/喂鱼音效 (可爱气泡声)
    function playGulp() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(420, now);
        osc.frequency.exponentialRampToValueAtTime(840, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      } catch (e) {}
    }

    // 3. 涡轮引擎加速音效
    function playTurboSound(isStart) {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        if (isStart) {
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);
        } else {
          osc.frequency.setValueAtTime(600, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.3);
        }
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.42);
      } catch (e) {}
    }

    // DOM 元素引用
    const speechText = document.getElementById('speechText');
    const statusTag = document.getElementById('statusTag');
    const speedNum = document.getElementById('speedNum');
    const fishCountEl = document.getElementById('fishCount');
    const sunglassesGroup = document.getElementById('sunglassesGroup');
    const turboFlame = document.getElementById('turboFlame');
    const effectsLayer = document.getElementById('effectsLayer');

    let fishCount = 0;
    let shadesOn = false;
    let isTurbo = false;
    let speechTimer = null;

    function setSpeech(text, duration = 1800) {
      if (!speechText) return;
      speechText.textContent = text;
      if (speechTimer) clearTimeout(speechTimer);
      speechTimer = setTimeout(() => {
        speechText.textContent = isTurbo ? '冲鸭~!' : 'Wheee~!';
      }, duration);
    }

    // 飘字动画效果
    function spawnFloatingEffect(emoji, x, y) {
      const el = document.createElement('div');
      el.className = 'float-item';
      el.textContent = emoji;
      el.style.left = (x || (45 + Math.random() * 20)) + '%';
      el.style.top = (y || (30 + Math.random() * 15)) + '%';
      effectsLayer.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    // 1. 车铃按钮
    document.getElementById('btnBell').addEventListener('click', () => {
      playBikeBell();
      setSpeech('叮铃铃~!');
      spawnFloatingEffect('🔔', 62, 38);
      const bell = document.querySelector('circle[cx="496"][cy="286"]');
      if (bell) {
        bell.classList.remove('ring-active');
        void bell.offsetWidth;
        bell.classList.add('ring-active');
      }
    });

    // 2. 喂小鱼按钮
    document.getElementById('btnFeed').addEventListener('click', () => {
      playGulp();
      fishCount++;
      fishCountEl.textContent = fishCount;
      const cheers = ['美味小鱼+1!', '好鲜美~!', '饱腹感满满!', '满血加速~', '小鱼干真香!'];
      setSpeech(cheers[fishCount % cheers.length]);
      spawnFloatingEffect('🐟', 68, 28);
      const pouch = document.querySelector('path[fill="url(#pouch)"]');
      if (pouch) {
        pouch.classList.remove('pouch-bounce');
        void pouch.offsetWidth;
        pouch.classList.add('pouch-bounce');
      }
    });

    // 3. 墨镜切换
    document.getElementById('btnShades').addEventListener('click', () => {
      shadesOn = !shadesOn;
      document.getElementById('shadesText').textContent = shadesOn ? '摘墨镜' : '戴墨镜';
      if (sunglassesGroup) {
        if (shadesOn) {
          sunglassesGroup.setAttribute('opacity', '1');
          sunglassesGroup.setAttribute('transform', 'translate(0, 0) scale(1)');
          setSpeech('本鸟最靓~ 😎');
          spawnFloatingEffect('✨', 60, 20);
        } else {
          sunglassesGroup.setAttribute('opacity', '0');
          sunglassesGroup.setAttribute('transform', 'translate(488, 166) scale(0.1)');
          setSpeech('清爽视野~');
        }
      }
    });

    // 4. 狂飙 Turbo 模式切换
    document.getElementById('btnTurbo').addEventListener('click', () => {
      isTurbo = !isTurbo;
      playTurboSound(isTurbo);
      const turboBtn = document.getElementById('btnTurbo');
      const turboText = document.getElementById('turboText');

      if (isTurbo) {
        turboText.textContent = '降速巡航';
        turboBtn.classList.remove('from-amber-500', 'to-rose-500');
        turboBtn.classList.add('from-rose-600', 'to-red-700', 'ring-2', 'ring-rose-400');
        statusTag.textContent = '⚡ 狂飙模式 88km/h';
        statusTag.className = 'inline-flex items-center px-1.5 py-0.2 rounded-md bg-rose-500/10 text-rose-600 font-bold text-[10px] border border-rose-500/20';
        speedNum.textContent = '88';
        speedNum.classList.add('text-rose-500');
        if (turboFlame) turboFlame.setAttribute('opacity', '1');
        setSpeech('起飞啦！！！🚀', 2500);
        spawnFloatingEffect('💨', 25, 68);
        spawnFloatingEffect('🔥', 20, 72);
      } else {
        turboText.textContent = '狂飙模式';
        turboBtn.classList.remove('from-rose-600', 'to-red-700', 'ring-2', 'ring-rose-400');
        turboBtn.classList.add('from-amber-500', 'to-rose-500');
        statusTag.textContent = '悠闲巡航 24km/h';
        statusTag.className = 'inline-flex items-center px-1.5 py-0.2 rounded-md bg-emerald-500/10 text-emerald-600 font-medium text-[10px] border border-emerald-500/20';
        speedNum.textContent = '24';
        speedNum.classList.remove('text-rose-500');
        if (turboFlame) turboFlame.setAttribute('opacity', '0');
        setSpeech('平稳减速~');
      }
    });
  </script>
</body>
</html>
